<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiritel — Technology Incubator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00D4FF;
      --text: #E2EEF4;
      --muted: #6A8A96;
      --border: rgba(0, 212, 255, 0.2);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #020B10;
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 80, 130, 0.5) 0%, transparent 65%),
        linear-gradient(160deg, #020B10 0%, #03111A 50%, #020C14 100%);
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 30%, black 30%, transparent 100%);
    }

    /* Scan line */
    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.1;
      animation: scan 10s linear infinite;
      z-index: 3;
    }
    @keyframes scan {
      from { top: -2px; }
      to   { top: 100vh; }
    }

    /* Corner accents */
    .corner {
      position: fixed;
      width: 36px; height: 36px;
      opacity: 0.2;
      z-index: 3;
    }
    .corner--tl { top: 20px; left: 20px; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner--tr { top: 20px; right: 20px; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
    .corner--bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner--br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

    /* ── Earth (full-screen scrolling background) ── */
    .earth-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .globe {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .globe-map {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      animation: earth-spin 90s linear infinite;
      opacity: 1;
    }
    /* Two real image tiles instead of an animated repeat-x background —
       mobile browsers (iOS Safari and Chrome both, differently) mis-paint
       animated repeating backgrounds, leaving black regions and detaching
       the dots from their continents (David's device test, 2026-09-04). */
    /* Divs with a single stretched background, not <img> tiles: percentage
       heights on replaced elements resolve inconsistently on mobile browsers,
       which detached the map picture from the dot layer (device test #2).
       Divs share the dots' exact containing-block math — glued by definition. */
    .globe-tile {
      position: absolute;
      top: 0; height: 100%; width: 50%;
      background-image: url('Spiritel%20Network%20Map.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .globe-tile:first-child { left: 0; }
    .globe-tile + .globe-tile { left: 50%; }

    @keyframes earth-spin {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    .globe-shade {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 30%, rgba(2, 11, 16, 0.8) 100%);
      pointer-events: none;
    }

    .globe-atmo { display: none; }

    /* ── Ticker-city markers: ride the spinning map (children of the animated
       layer), one per map copy so a dot is always aboard as the world wraps. */
    .city-dot {
      position: absolute;
      width: 21px; height: 21px;
      margin: -10.5px 0 0 -10.5px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFE08A 0%, #FFB627 55%, rgba(255,182,39,0.5) 100%);
      box-shadow: 0 0 14px rgba(255,182,39,0.85), 0 0 34px rgba(255,182,39,0.4);
      animation: dot-pulse 2.4s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.35); }
    }
    @media (max-width: 600px) {
      /* The map squeezes ~4x narrower on a phone; fixed 21px dots read as
         golf balls. Scale them (and their glow) down with the map. */
      .city-dot {
        width: 11px; height: 11px;
        margin: -5.5px 0 0 -5.5px;
        box-shadow: 0 0 8px rgba(255,182,39,0.85), 0 0 18px rgba(255,182,39,0.4);
      }
      /* The desktop vignette blacks out the lower half of a tall-narrow
         viewport — widen it so the map stays visible down the screen. */
      .globe-shade {
        background: radial-gradient(ellipse 150% 85% at 50% 35%, transparent 45%, rgba(2,11,16,0.75) 100%);
      }
    }

    /* ── Main content ── */
    .stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Anchored low (2026-09-04): the wordmark rides the dark ocean beneath
         the world map, where it stays visible; the ticker owns the top strip. */
      justify-content: flex-end;
      padding-top: 34px;
      padding-bottom: clamp(2.5rem, 7vh, 5rem);
      text-align: center;
    }

    /* ── Market + world-clock ticker ── */
    .ticker {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      height: 34px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(to bottom, rgba(2,11,16,0.85), rgba(2,11,16,0.35));
      border-bottom: 1px solid var(--border);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
    }
    .ticker-track {
      display: flex;
      flex-shrink: 0;
      white-space: nowrap;
      animation: ticker-scroll 70s linear infinite;
    }
    .ticker:hover .ticker-track { animation-play-state: paused; }
    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .ticker-seq {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
    .ticker-seq span { display: inline-flex; align-items: center; }
    .tk-label { color: var(--cyan); font-weight: 700; text-transform: uppercase; margin-right: 6px; }
    .tk-day { color: var(--muted); font-weight: 600; margin-right: 6px; }
    .tk-value { color: var(--text); font-weight: 500; }
    .tk-sep { color: var(--muted); margin: 0 18px; }
    @media (max-width: 600px) { .ticker-seq { font-size: 11px; } .tk-sep { margin: 0 12px; } }

    /* Wordmark */
    .wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      letter-spacing: 0.3em;
      color: #fff;
      text-shadow: 0 0 40px rgba(0, 212, 255, 0.45);
      line-height: 1;
    }
    .wordmark span { color: var(--cyan); }

    .brand-block {
      display: inline-block;
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .brand-block .wordmark { margin-bottom: 0.3rem; }

    .category {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.7rem;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .divider {
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin: 0 auto 1.25rem;
      opacity: 0.4;
    }

    .tagline {
      font-size: clamp(1.15rem, 2.2vw, 1.4rem);
      font-weight: 400;
      color: #9BB8C8;
      font-style: italic;
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
    }

    /* ── Contact card ── */
    .card {
      border: 1px solid var(--border);
      background: rgba(0, 18, 30, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 4px;
      padding: 2rem 2.75rem;
      display: inline-flex;
      align-items: center;
      gap: 2rem;
    }

    .card-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      object-position: center top;
      flex-shrink: 0;
      filter: saturate(0.85);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      text-align: left;
    }

    .card-name {
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 500;
    }

    .card-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .card-row svg { flex-shrink: 0; opacity: 0.55; }
    .card-row a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .card-row a:hover { color: var(--cyan); }

    .card-img-wrap {
      position: relative;
      display: inline-block;
      max-width: 420px;
      width: 85vw;
    }
    .card-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
    .card-link {
      position: absolute;
      display: block;
    }
    .card-link--email {
      right: 5%; top: 55%;
      width: 38%; height: 14%;
    }
    .card-link--phone {
      right: 5%; top: 72%;
      width: 38%; height: 14%;
    }

    /* Landscape phones: the full-size wordmark + card overflow a ~400px-tall
       viewport and collide with the ticker. Compact both. */
    @media (max-height: 520px) {
      .wordmark { font-size: 1.6rem; letter-spacing: 0.22em; margin-bottom: 0.5rem !important; }
      /* width:auto shrink-wraps the container to the scaled-down image, so
         the card centers under the wordmark and the percentage-positioned
         email/phone tap zones stay glued to the artwork. */
      .card-img-wrap { max-height: 58vh; width: auto; max-width: none; }
      .card-img { max-height: 58vh; width: auto; }
      .stage { padding-bottom: 1rem; }
    }
    @media (max-width: 500px) {
      /* .globe/.earth-stage overrides removed 2026-09-04: relics of the old
         small-sphere design that shrank today's full-screen map to a 340px
         square on phones. The map now fills the viewport at every width. */
      .corner { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="scanline"></div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- Spinning Earth — lower third -->
  <div class="earth-stage">
    <div class="globe">
      <div class="globe-map"><div class="globe-tile"></div><div class="globe-tile"></div></div>
      <div class="globe-shade"></div>
    </div>
    <div class="globe-atmo"></div>
  </div>

  <!-- Main content -->
  <main class="stage">

    <h1 class="wordmark" style="margin-bottom:1.5rem;">SPIRI<span>TEL</span></h1>

    <div class="card-img-wrap">
      <img class="card-img" src="wave-contact-card.png" alt="David Clavadetscher — Technology Incubator contact card">
      <a class="card-link card-link--email" href="mailto:david@spiritel.net" aria-label="Email david@spiritel.net"></a>
      <a class="card-link card-link--phone" href="tel:7146812412" aria-label="Call (714) 681-2412"></a>
    </div>

  </main>

  <!-- Market + world-clock ticker (prices via /api/ticker, 10-min edge cache;
       clocks are pure browser time — no API) -->
  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <script>
  (function () {
    var prices = null;

    // name, IANA zone, then map position as fractions of one map copy
    // (x across, y down) — hand-calibrated to the stylized network map.
    var CITIES = [
      ['Los Angeles', 'America/Los_Angeles', 0.145, 0.43],
      ['New York', 'America/New_York', 0.3125, 0.389],
      ['São Paulo', 'America/Sao_Paulo', 0.389, 0.75],
      ['London', 'Europe/London', 0.527, 0.272],
      ['Moscow', 'Europe/Moscow', 0.611, 0.283],
      ['Johannesburg', 'Africa/Johannesburg', 0.587, 0.756],
      ['Tokyo', 'Asia/Tokyo', 0.854, 0.417]
    ];

    // Red map dots for each ticker city. The map layer is 200% wide holding
    // two copies (0-50% and 50-100%), so each city gets a dot in both.
    (function () {
      var map = document.querySelector('.globe-map');
      if (!map) return;
      var html = '';
      for (var i = 0; i < CITIES.length; i++) {
        for (var c = 0; c < 2; c++) {
          html += '<div class="city-dot" style="left:' + (CITIES[i][2] * 50 + c * 50) + '%;top:' + (CITIES[i][3] * 100) + '%"></div>';
        }
      }
      map.insertAdjacentHTML('beforeend', html);
    })();

    function fmtMoney(n, decimals) {
      return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function seqHTML() {
      var parts = [];
      if (prices) {
        if (prices.dow) parts.push('<span><span class="tk-label">Dow</span><span class="tk-value">' + fmtMoney(prices.dow, 0) + '</span></span>');
        if (prices.gold) parts.push('<span><span class="tk-label">Gold</span><span class="tk-value">$' + fmtMoney(prices.gold, 0) + '</span></span>');
        if (prices.oil) parts.push('<span><span class="tk-label">Oil</span><span class="tk-value">$' + fmtMoney(prices.oil, 2) + '</span></span>');
        if (prices.btc) parts.push('<span><span class="tk-label">Bitcoin</span><span class="tk-value">$' + fmtMoney(prices.btc, 0) + '</span></span>');
      }
      var now = new Date();
      for (var i = 0; i < CITIES.length; i++) {
        var day = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: CITIES[i][1] }).format(now).toUpperCase();
        var t = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: CITIES[i][1] }).format(now);
        parts.push('<span><span class="tk-label">' + CITIES[i][0] + '</span><span class="tk-day">' + day + '</span><span class="tk-value">' + t + '</span></span>');
      }
      return '<span class="ticker-seq">' + parts.join('<span class="tk-sep">▪</span>') + '<span class="tk-sep">▪</span></span>';
    }

    function render() {
      // Two identical sequences make the -50% scroll loop seamless.
      var one = seqHTML();
      document.getElementById('tickerTrack').innerHTML = one + one;
    }

    function loadPrices() {
      fetch('/api/ticker').then(function (r) {
        if (!r.ok) throw new Error();
        return r.json();
      }).then(function (data) {
        if (!data.error) { prices = data; render(); }
      }).catch(function () { /* clocks-only is fine */ });
    }

    render();               // clocks immediately
    loadPrices();           // prices when they arrive
    setInterval(render, 30000);          // keep clocks current
    setInterval(loadPrices, 600000);     // refresh prices every 10 min

    // iOS computes tile/dot percentage layout before the browser toolbars
    // settle and won't re-measure until forced (a pinch-zoom did it in
    // David's field test). Nudge the map's children to re-lay-out after
    // load and on any resize/rotation — without touching the animated
    // parent, so the spin never restarts.
    function nudgeMap() {
      var els = document.querySelectorAll('.globe-tile, .city-dot');
      for (var i = 0; i < els.length; i++) {
        els[i].style.display = 'none';
        void els[i].offsetHeight;
        els[i].style.display = '';
      }
    }
    window.addEventListener('resize', nudgeMap);
    window.addEventListener('orientationchange', function () { setTimeout(nudgeMap, 350); });
    setTimeout(nudgeMap, 600);
    setTimeout(nudgeMap, 2000);
  })();
  </script>

</body>
</html>
